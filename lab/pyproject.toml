[project]
name = "jevmon-lab"
version = "0.0.0"
license = "MIT"
authors = [{ name = "Matteo Bernacchia", email = "dev@kikijiki.com" }]
description = "Process-launch lab, dataset tooling and judge experiments for jevmon"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jevmon",
  "trackio==0.39.0",
]

[project.scripts]
jevmon-lab = "jevmon_lab.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]
# Which torch wheel: exactly one of `cpu` (default) or `gpu` (ROCm, the iGPU), as in ../app.
cpu = ["torch"]
gpu = ["torch", "triton-rocm; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevmon_lab"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.uv.sources]
jevmon = { path = "../app", editable = true }
torch = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-rocm", group = "gpu" },
]
# the ROCm torch wheels depend on triton-rocm, which only that index serves
triton-rocm = { index = "pytorch-rocm", group = "gpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
extend-select = ["UP", "FA"]

[tool.ruff.lint.isort]
known-first-party = ["jevmon", "jevmon_lab"]
