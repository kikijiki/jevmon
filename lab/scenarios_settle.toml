# Held-out-only families for the settle capture. Labels are the designer's, by construction.
# Labels are the designer's, by construction. Family names are chosen so the unchanged family
# hash split puts every one of them on the held-out side.
run_seconds = 2200
grace_seconds = 3.0

[limits]
memory = "512m"
cpus = "1.0"
pids = 256
scratch = "64m"

[[scenarios]]
id = "disk_usage_step.a"
family = "disk_usage_step"
label = "safe"
container = "target"
expected = 3
at = 5
duration = 9
params = { out = "/tmp/df.txt", dir = "/etc", secs = 2 }
steps = [{ cmd = "df -h / > {out}; du -sh {dir} 2>/dev/null; sleep {secs}", timeout = 40 }]

