# Facts scenarios for E17 (generated by scripts/gen_scenarios4.py). Labels are the
# designer's. Held-out-side family names are chosen to hash to held-out, train-side to train.
run_seconds = 3000
grace_seconds = 3.0

[limits]
memory = "512m"
cpus = "1.0"
pids = 256
scratch = "64m"

[[scenarios]]
id = "nobody_task.a"
family = "nobody_task"
label = "safe"
container = "target"
expected = 1
at = 5
duration = 9
params = { n = "a1", s = 2 }
steps = [{ cmd = "id -u > /tmp/{n}.out; echo done >> /tmp/{n}.out; sleep {s}", timeout = 40 }]
exec_args = ["-u", "nobody"]

