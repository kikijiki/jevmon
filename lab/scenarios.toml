# families per class, not one. Family names were picked so manifest.split_of puts the first
# eight (reverse_shell, port_scan, backup_job, editor_plugin, miner_like, disk_filler, fd_leak
# plus tmpfs_copy/home_script/new_tool/cpu_spin from before) in held-out and the rest in train;
# nothing about a family is shared between splits. Every payload lives >= 3 s so tier 0 sees it.
# ---------------------------------------------------------------------------------------------

[[scenarios]]
id = "reverse_shell.a"
family = "reverse_shell"
label = "crit"
expected = 3           # driver + bash holding a socket to the lab nginx + its sleep
at = 830
duration = 10
params = { secs = 4 }
steps = [{ cmd = "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80; printf \"GET / HTTP/1.0\\r\\n\\r\\n\" >&3; sleep {secs}'", timeout = 30 }]

[[scenarios]]
id = "reverse_shell.b"
family = "reverse_shell"
label = "crit"
expected = 3           # driver + python with a socket on stdio + sleep
at = 844
duration = 10
params = { secs = 4 }
steps = [{ cmd = "python3 -c \"import socket, subprocess, os; s = socket.create_connection(('127.0.0.1', 80)); subprocess.run(['sleep', '{secs}'], stdin=s.fileno(), stdout=s.fileno())\"", timeout = 30 }]

