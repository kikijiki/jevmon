# Lab scenario manifest: scripted process-launch sequences inside the lab containers, labelled by
# construction for the judge (see [judge.categories] in src/jevmon/default.toml).
#
# Each [[scenarios]] entry starts `at` seconds into the run, lasts `duration` seconds and drives
# its shell `steps` in `container`. Ground truth is `label`, one of the judge's three classes
# `safe`, `warn`, `crit` (see [judge.categories] in src/jevmon/default.toml). A scenario with no
# `label` carries an `excluded` reason instead: the judge sees one launch only, so rate and
# resource scenarios (fork storms, retry and spin loops, memory growth) have no single-launch
# label; they stay in the manifest and in the capture but are left out of the labelled export and
# of every score. `family` groups parameterised variants - a whole family goes to one side of the
# train/held-out split (manifest.split_of), so held-out families are unseen. `expected` is the
# number of payload launches the command spawns by construction (driver shell included, counted
# by hand); the report compares it against what the tier-0 poller actually observed.
#
# Commands are deliberately harmless (echo/sleep/true, cp of system binaries to new names, short
# shell loops, python -c print/alloc loops, curl against the lab's own nginx). What differs is the
# launch PATTERN: safe build/package/shell/timer/session/swarm shapes, one-off warn runs, crit
# shapes (copied binary in a world-writable dir, inline encoded command, unexpected parent,
# hidden scheduled task, download-and-run) and bounded rate/resource runs (excluded) confined by
# the container cgroup limits (pids, memory, cpus). Scenarios whose payloads live well under the
# poll interval are the deliberately short-lived variants: their miss rate is measured, not
# hidden.
#
# The `background.idle` scenario runs in the actor container for the whole run (safe traffic);
# everything else runs in the target. Tag windows must not overlap per container (validated).

run_seconds = 7140
grace_seconds = 3.0

[limits]
memory = "512m"      # container memory == swap limit (no swap); mem_grower stays under it
cpus = "1.0"         # one core: cpu_spin is throttled here, never on the host
pids = 256           # fork storms are bounded by this
scratch = "64m"      # size-limited tmpfs at /scratch

# ---------------------------------------------------------------------------------------------
# Background: a benign periodic worker in the actor container for the whole run, so safe
# contexts exist outside the scenario windows too (they carry no ground-truth label).
# ---------------------------------------------------------------------------------------------
[[scenarios]]
id = "background.idle"
family = "idle_daemon"
label = "safe"
container = "actor"
expected = 0
at = 0
duration = 1318
# Slower cadence than the original 3 s loop: the run grew and one held-out family must not
# drown the class mix (docs/finetune.md, stage 3).
steps = [
  { cmd = "nohup sh -c 'i=0; while [ $i -lt 80 ]; do sleep 6 & i=$((i+1)); sleep 6; wait; done' >/dev/null 2>&1 & sleep 1; true", timeout = 15 },
]

