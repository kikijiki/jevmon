# Splunk attack_data (Linux sysmon + auditd). The only label source is the technique folder a log
# came from: folder -> ATT&CK technique -> tactic -> class. Background launches in the same logs
# (agent polling, package hooks) share the folder, so the folder label is weak; the reviewed sample
# (review sheet) is what the headline numbers use. Tactic of a technique is ATT&CK's own taxonomy.

source = "splunk-attack-data-linux"
review_size = 300
seed = 7
# A launch whose key shows up in at least this many different technique folders, or that repeats
# this many times inside one log, is polling/background and stays unlabelled (role = background).
background_min_folders = 3
background_min_repeats = 10

[tactic_class]   # tactic -> class
execution = "crit"
persistence = "crit"
privilege-escalation = "crit"
defense-evasion = "crit"
credential-access = "crit"
command-and-control = "crit"
exfiltration = "crit"
impact = "crit"
lateral-movement = "crit"
resource-development = "crit"
initial-access = "crit"
discovery = "warn"
collection = "warn"

[[rule]]
id = "tactic-class"
when = { tactic = [
  "execution", "persistence", "privilege-escalation", "defense-evasion", "credential-access",
  "command-and-control", "exfiltration", "impact", "lateral-movement", "resource-development",
  "initial-access",
] }
to = "crit"
uncertain = "folder label: the launch may be background in a hostile replay"
[[rule]]
id = "tactic-warn"
when = { tactic = ["discovery", "collection"] }
to = "warn"
uncertain = "folder label (discovery/collection counted as warn); the launch may be background"
[[rule]]
id = "unknown-tactic"
when = {}
to = "null"

# technique id (folder name prefix) -> primary ATT&CK tactic (enterprise matrix, first listed tactic)
