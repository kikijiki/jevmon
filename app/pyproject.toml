[project]
name = "jevmon"
version = "0.0.0"
license = "MIT"
authors = [{ name = "Matteo Bernacchia", email = "dev@kikijiki.com" }]
description = "Resource and process monitor driven by a small open-weight decision model"
requires-python = ">=3.13,<3.14"
dependencies = [
  "laya>=0.4.2",
  "safetensors",
]

[dependency-groups]
# pillow rasterises the README screenshots (docs/screenshots/*.png) from a tmux capture.
dev = ["pytest", "ruff", "pillow"]
# Which torch wheel: exactly one of `cpu` (default) or `gpu` (ROCm, the iGPU). laya pulls torch
# in transitively; [tool.uv.sources] below picks the index per group.
cpu = ["torch"]
gpu = ["torch", "triton-rocm; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevmon"]

# torch comes from the group-selected index: `cpu` (default) is the CPU-only wheel (the PyPI Linux
# wheel pulls ~GBs of CUDA libraries and this box has no NVIDIA GPU); `gpu` is the ROCm wheel for
# the iGPU (~6 GB). Select with `uv sync --group gpu --no-group cpu`; `just gpu-sync` does it.
[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-rocm", group = "gpu" },
]
# the ROCm torch wheels depend on triton-rocm, which only that index serves
triton-rocm = { index = "pytorch-rocm", group = "gpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Pyupgrade (UP) and future-annotations (FA) on top of ruff's defaults. This project targets
# Python 3.13 only, so modern syntax is used directly and `from __future__ import annotations`
# is never needed.
[tool.ruff.lint]
extend-select = ["UP", "FA"]

[project.scripts]
jevmon = "jevmon.cli:main"
jevmond = "jevmon.daemon.server:main"
