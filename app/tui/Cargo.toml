[package]
name = "jevmon-tui"
version = "0.0.0"
edition = "2024"
publish = false
description = "Ratatui client for the jevmon daemon control socket"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
